[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-compress"
version = "0.1.0"
description = "LLM codebase compression, decompression, and optional autoresearch."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "llm-compression contributors"}]
dependencies = []

[project.scripts]
llm-compress = "llm_compress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
